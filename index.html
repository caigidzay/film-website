<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KFilm - Xem Phim Online</title>
  <style>
    body {
      background: #0f0f0f;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      background: #1a1a1a;
      padding: 15px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }
    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 15px;
    }
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
    }
    .movie-card {
      background: #1a1a1a;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: 0.3s;
    }
    .movie-card:hover {
      transform: scale(1.05);
    }
    .movie-card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
    }
    .movie-info {
      padding: 10px;
      text-align: center;
    }
    video {
      width: 100%;
      max-width: 1000px;
      margin: 20px auto;
      display: block;
      background: black;
    }
  </style>
</head>
<body>
  <header>KFilm - Xem Phim Online Miễn Phí</header>
  <div class="container">
    <h2>Phim Hot</h2>
    <div class="movie-grid" id="movieList"></div>
  </div>

  <script>
    const movies = [
      {
        title: "Big Buck Bunny",
        poster: "https://picsum.photos/id/1015/300/400",
        m3u8: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
      },
      // Thêm phim + link m3u8 của bạn vào đây
    ];

    const container = document.getElementById('movieList');

    movies.forEach(movie => {
      const card = document.createElement('div');
      card.className = 'movie-card';
      card.innerHTML = `
        <img src="${movie.poster}" alt="${movie.title}">
        <div class="movie-info">
          <h3>${movie.title}</h3>
          <button onclick="playMovie('${movie.m3u8}', '${movie.title}')">▶ Xem Ngay</button>
        </div>
      `;
      container.appendChild(card);
    });

    function playMovie(url, title) {
      document.body.innerHTML = `
        <div style="text-align:center; padding:20px;">
          <h1>${title}</h1>
          <video controls autoplay>
            <source src="${url}" type="video/mp4">
          </video>
          <br><br>
          <button onclick="location.reload()">← Quay lại danh sách</button>
        </div>
      `;
    }
  </script>
</body>
</html>
