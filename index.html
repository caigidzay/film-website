<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KFilm - Xem Phim Online Miễn Phí</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: white; font-family: 'Segoe UI', sans-serif; }
    header {
      background: linear-gradient(90deg, #1a1a1a, #c00);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { font-size: 28px; font-weight: bold; color: #ff4444; }
    .search {
      width: 500px;
      padding: 10px 20px;
      border-radius: 30px;
      border: none;
      font-size: 16px;
    }
    .banner {
      height: 400px;
      background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://picsum.photos/id/1015/1920/600');
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
    }
    .category { padding: 20px; font-size: 22px; font-weight: bold; }
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 15px;
      padding: 0 20px 40px;
    }
    .movie-card {
      background: #1f1f1f;
      border-radius: 10px;
      overflow: hidden;
      transition: 0.3s;
    }
    .movie-card:hover { transform: scale(1.1); }
    .movie-card img { width: 100%; height: 220px; object-fit: cover; }
    .movie-info { padding: 10px; text-align: center; }
    button {
      background: #c00;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 6px;
      margin-top: 8px;
      cursor: pointer;
    }
    video { width: 100%; max-width: 1100px; margin: 20px auto; display: block; }
  </style>
</head>
<body>
  <header>
    <div class="logo">KFILM</div>
    <input type="text" class="search" placeholder="🔍 Tìm phim..." id="searchInput" onkeyup="searchMovies()">
  </header>

  <div class="banner">
    <div>
      <h1 style="font-size: 48px;">Xem Phim Hay Nhất 2026</h1>
      <p>Không quảng cáo - Xem online miễn phí</p>
    </div>
  </div>

  <div class="category">Phim Hot</div>
  <div class="movie-grid" id="movieList"></div>

  <script>
    const movies = [
      { title: "Big Buck Bunny", poster: "https://picsum.photos/id/1015/300/400", m3u8: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" },
      { title: "Sintel", poster: "https://picsum.photos/id/201/300/400", m3u8: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4" },
      { title: "Tears of Steel", poster: "https://picsum.photos/id/301/300/400", m3u8: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4" },
      // Thêm phim của bạn vào đây
    ];

    function loadMovies(list) {
      const container = document.getElementById('movieList');
      container.innerHTML = '';
      list.forEach(movie => {
        const card = document.createElement('div');
        card.className = 'movie-card';
        card.innerHTML = `
          <img src="${movie.poster}">
          <div class="movie-info">
            <h4>${movie.title}</h4>
            <button onclick="playMovie('${movie.m3u8}', '${movie.title}')">▶ Xem</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function searchMovies() {
      const term = document.getElementById('searchInput').value.toLowerCase();
      const filtered = movies.filter(m => m.title.toLowerCase().includes(term));
      loadMovies(filtered.length ? filtered : movies);
    }

    function playMovie(url, title) {
      document.body.innerHTML = `
        <div style="text-align:center; padding:20px; background:#000;">
          <h1>${title}</h1>
          <video controls autoplay>
            <source src="${url}" type="video/mp4">
          </video>
          <br><br>
          <button onclick="location.reload()" style="padding:12px 25px; font-size:18px;">← Quay lại</button>
        </div>
      `;
    }

    loadMovies(movies);
  </script>
</body>
</html>
