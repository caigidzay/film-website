<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KFilm - Xem Phim Online Miễn Phí</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#0a0a0a; color:white; font-family:Arial, sans-serif; }
    header {
      background: linear-gradient(90deg, #1a1a1a, #c00);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo { font-size: 28px; font-weight: bold; color: #ff4444; }
    .search { width: 500px; padding: 10px 20px; border-radius: 30px; border: none; font-size: 16px; }
    .banner {
      height: 420px;
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://picsum.photos/id/1015/1920/600');
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .category { padding: 25px 20px 10px; font-size: 22px; font-weight: bold; border-bottom: 2px solid #c00; margin-bottom: 15px; }
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 15px;
      padding: 0 20px 40px;
    }
    .movie-card {
      background: #1f1f1f;
      border-radius: 12px;
      overflow: hidden;
      transition: 0.3s;
    }
    .movie-card:hover { transform: scale(1.08); box-shadow: 0 10px 20px rgba(255,0,0,0.3); }
    .movie-card img { width: 100%; height: 240px; object-fit: cover; }
    .movie-info { padding: 12px; text-align: center; }
    button { background: #c00; color: white; border: none; padding: 8px 18px; border-radius: 6px; margin-top: 8px; cursor: pointer; }
    video { width: 100%; max-width: 1100px; margin: 20px auto; display: block; background: black; }
  </style>
</head>
<body>
  <header>
    <div class="logo">KFILM</div>
    <input type="text" class="search" placeholder="🔍 Tìm phim..." id="searchInput" onkeyup="searchMovies()">
  </header>

  <div class="banner">
    <div>
      <h1 style="font-size: 42px;">KFilm - Xem Phim Online</h1>
      <p>Không quảng cáo - Cập nhật phim mới liên tục</p>
    </div>
  </div>

  <!-- Phim Hot -->
  <div class="category">Phim Hot</div>
  <div class="movie-grid" id="hotList"></div>

  <!-- Phim Lẻ -->
  <div class="category">Phim Lẻ</div>
  <div class="movie-grid" id="leList"></div>

  <!-- Phim Bộ -->
  <div class="category">Phim Bộ</div>
  <div class="movie-grid" id="boList"></div>

  <script>
    const movies = [
      // Phim Hot
      { title: "The Batman", category: "hot", poster: "https://picsum.photos/id/1015/300/400", m3u8: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4", type: "le" },
      { title: "Dune Part Two", category: "hot", poster: "https://picsum.photos/id/201/300/400", m3u8: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4", type: "le" },
      { title: "Oppenheimer", category: "hot", poster: "https://picsum.photos/id/301/300/400", m3u8: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4", type: "le" },
      
      // Phim Lẻ
      { title: "The Killer", category: "le", poster: "https://picsum.photos/id/401/300/400", m3u8: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4", type: "le" },
      { title: "Extraction 2", category: "le", poster: "https://picsum.photos/id/501/300/400", m3u8: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4", type: "le" },
      
      // Phim Bộ
      { title: "The Boys Season 4", category: "bo", poster: "https://picsum.photos/id/601/300/400", m3u8: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4", type: "bo" },
      { title: "House of the Dragon", category: "bo", poster: "https://picsum.photos/id/701/300/400", m3u8: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4", type: "bo" },
    ];

    function loadMovies() {
      const hot = movies.filter(m => m.category === "hot");
      const le = movies.filter(m => m.type === "le");
      const bo = movies.filter(m => m.type === "bo");

      renderGrid('hotList', hot);
      renderGrid('leList', le);
      renderGrid('boList', bo);
    }

    function renderGrid(id, list) {
      const container = document.getElementById(id);
      container.innerHTML = '';
      list.forEach(movie => {
        const card = document.createElement('div');
        card.className = 'movie-card';
        card.innerHTML = `
          <img src="${movie.poster}">
          <div class="movie-info">
            <h4>${movie.title}</h4>
            <button onclick="playMovie('${movie.m3u8}', '${movie.title}')">▶ Xem</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function searchMovies() {
      const term = document.getElementById('searchInput').value.toLowerCase();
      const filtered = movies.filter(m => m.title.toLowerCase().includes(term));
      document.getElementById('hotList').innerHTML = '';
      document.getElementById('leList').innerHTML = '';
      document.getElementById('boList').innerHTML = '';
      renderGrid('hotList', filtered);
      renderGrid('leList', filtered);
      renderGrid('boList', filtered);
    }

    function playMovie(url, title) {
      document.body.innerHTML = `
        <div style="text-align:center; padding:20px; background:#000; min-height:100vh;">
          <h1>${title}</h1>
          <video controls autoplay>
            <source src="${url}" type="video/mp4">
          </video>
          <br><br>
          <button onclick="location.reload()" style="padding:12px 30px; font-size:18px;">← Quay lại trang chủ</button>
        </div>
      `;
    }

    loadMovies();
  </script>
</body>
</html>
