<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KFilm - Xem Phim Online Miễn Phí</title>
  <style>
    body { background: #0a0a0a; color: white; font-family: Arial, sans-serif; margin: 0; }
    header {
      background: linear-gradient(90deg, #1a1a1a, #ff0000);
      padding: 20px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
    }
    .search {
      width: 80%;
      max-width: 600px;
      padding: 12px;
      margin: 20px auto;
      display: block;
      border-radius: 30px;
      border: none;
      font-size: 16px;
    }
    .category {
      padding: 0 20px;
      margin: 20px 0 10px;
      font-size: 20px;
      font-weight: bold;
    }
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
      padding: 0 20px;
    }
    .movie-card {
      background: #1f1f1f;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: 0.3s;
    }
    .movie-card:hover { transform: scale(1.08); }
    .movie-card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
    }
    .movie-info {
      padding: 12px;
      text-align: center;
    }
    button {
      background: #ff0000;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      margin-top: 8px;
      cursor: pointer;
    }
    video {
      width: 100%;
      max-width: 1100px;
      margin: 20px auto;
      display: block;
      background: black;
    }
  </style>
</head>
<body>
  <header>KFilm - Xem Phim Online</header>
  <input type="text" class="search" placeholder="🔍 Tìm kiếm phim..." id="searchInput" onkeyup="searchMovies()">

  <div class="category">Phim Hot</div>
  <div class="movie-grid" id="movieList"></div>

  <script>
    const movies = [
      { title: "Big Buck Bunny", poster: "https://picsum.photos/id/1015/300/400", m3u8: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" },
      { title: "Sintel", poster: "https://picsum.photos/id/201/300/400", m3u8: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4" },
      { title: "Tears of Steel", poster: "https://picsum.photos/id/301/300/400", m3u8: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4" },
      // Thêm phim + link m3u8 của bạn vào đây
    ];

    function loadMovies(filteredMovies) {
      const container = document.getElementById('movieList');
      container.innerHTML = '';
      filteredMovies.forEach(movie => {
        const card = document.createElement('div');
        card.className = 'movie-card';
        card.innerHTML = `
          <img src="${movie.poster}" alt="${movie.title}">
          <div class="movie-info">
            <h3>${movie.title}</h3>
            <button onclick="playMovie('${movie.m3u8}', '${movie.title}')">▶ Xem Ngay</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function searchMovies() {
      const term = document.getElementById('searchInput').value.toLowerCase();
      const filtered = movies.filter(m => m.title.toLowerCase().includes(term));
      loadMovies(filtered.length ? filtered : movies);
    }

    function playMovie(url, title) {
      document.body.innerHTML = `
        <div style="text-align:center; padding:20px; background:#000;">
          <h1>${title}</h1>
          <video controls autoplay>
            <source src="${url}" type="video/mp4">
          </video>
          <br><br>
          <button onclick="location.reload()" style="padding:10px 20px; font-size:16px;">← Quay lại danh sách phim</button>
        </div>
      `;
    }

    // Load ban đầu
    loadMovies(movies);
  </script>
</body>
</html>
